server {
    listen 80;
    server_name _;

    # ---- API 反向代理（优先匹配） ----
    location ~ ^/(health|config|alerts|signals|auth|admins|devices|agent|ingest|debug|replay|runtime|vision|users|dashboard|ops|download|stream) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ---- 前端静态文件 + 兜底 ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
