server {
    listen 80;
    server_name _;

    client_max_body_size 1024m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ { proxy_pass http://backend:8000/auth/; }
    location /alerts { proxy_pass http://backend:8000/alerts; }
    location /devices { proxy_pass http://backend:8000/devices; }
    location /settings { proxy_pass http://backend:8000/settings; }
    location /logs/ { proxy_pass http://backend:8000/logs/; }
    location /ops/ { proxy_pass http://backend:8000/ops/; }
    location /replay/ { proxy_pass http://backend:8000/replay/; }
    location /stream/ {
        proxy_pass http://backend:8000/stream/;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
